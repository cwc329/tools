<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>小工具集</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    ul { list-style: none; padding: 0; }
    li { margin: 12px 0; }
    a {
      display: block;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-decoration: none;
      color: #333;
      transition: background 0.15s;
    }
    a:hover { background: #f5f5f5; }
    .tool-name { font-size: 1.1em; font-weight: bold; }
    .tool-desc { font-size: 0.9em; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>小工具集</h1>
  <ul>
    <li>
      <a href="./ig-exif-hashtag/">
        <div class="tool-name">IG EXIF Hashtag Generator</div>
        <div class="tool-desc">從照片 EXIF 資訊自動產生 Instagram Hashtag</div>
      </a>
    </li>
  </ul>
</body>
</html>
