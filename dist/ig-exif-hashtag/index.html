<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>IG EXIF Hashtag Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    button { margin-top: 10px; padding: 6px 12px; }
    textarea { width: 100%; height: 150px; margin-top: 10px; }
    fieldset { margin-top: 10px; border: 1px solid #ccc; padding: 10px; }
    fieldset label { display: inline-block; margin-right: 12px; margin-bottom: 6px; cursor: pointer; }
    .warn { color: #b8860b; font-size: 13px; margin-top: 6px; }
    #loading { display: none; margin-top: 10px; color: #666; }
  </style>
  <script type="module" crossorigin src="/assets/ig-exif-hashtag-1QlJjxjx.js"></script>
</head>
<body>
  <h2>IG EXIF Hashtag Generator</h2>
  <input type="file" id="photo" accept="image/*" />

  <fieldset id="fields">
    <legend>選擇要產生的 Hashtag 欄位</legend>
    <label><input type="checkbox" value="make" /> 品牌</label>
    <label><input type="checkbox" value="camera" checked /> 相機</label>
    <label><input type="checkbox" value="lens" checked /> 鏡頭</label>
    <label><input type="checkbox" value="focalLength" /> 焦距</label>
    <label><input type="checkbox" value="focalLength35" /> 等效焦距</label>
    <label><input type="checkbox" value="aperture" /> 光圈</label>
    <label><input type="checkbox" value="shutter" /> 快門</label>
    <label><input type="checkbox" value="iso" /> ISO</label>
    <label><input type="checkbox" value="exposureProgram" /> 拍攝模式</label>
    <label><input type="checkbox" value="meteringMode" /> 測光模式</label>
    <label><input type="checkbox" value="whiteBalance" /> 白平衡</label>
    <label><input type="checkbox" value="flash" /> 閃光燈</label>
    <label><input type="checkbox" value="date" /> 拍攝月份</label>
  </fieldset>

  <div id="warnings"></div>
  <div id="loading">解析中，首次載入可能需要數秒...</div>
  <textarea id="output" placeholder="Hashtag 會顯示在這裡"></textarea>
  <button id="copy-btn">複製</button>

  <details style="margin-top: 16px;">
    <summary style="cursor: pointer; color: #666;">顯示原始 EXIF 資料（除錯用）</summary>
    <pre id="debug" style="background: #f5f5f5; padding: 10px; font-size: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all;"></pre>
  </details>

</body>
</html>
